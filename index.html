<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring til Laura</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 18px; }
    button { padding: 10px 14px; margin-right: 10px; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; white-space: pre-wrap; }
    .tag { display:inline-block; padding:4px 8px; border-radius:999px; background:#eee; margin-left:8px; font-size:12px; }
  </style>
</head>
<body>
  <h1>Ring til Laura <span class="tag">vA-STOPLOOP-001</span></h1>
  <p>Tryk ring — giv mikrofonadgang — og sig dit navn.</p>

  <button id="btnCall">Ring til Laura</button>
  <button id="btnHangup" disabled>Læg på</button>

  <pre id="log">Klar.</pre>

  <!-- Twilio Voice JS SDK (officiel CDN) -->
  <script src="https://sdk.twilio.com/js/voice/releases/2.17.0/twilio.min.js"></script>

  <script>
    const TOKEN_URL = "https://anyandall-laura-mvp.onrender.com/token";
    const logEl = document.getElementById("log");
    const btnCall = document.getElementById("btnCall");
    const btnHangup = document.getElementById("btnHangup");

    let device = null;
    let call = null;
    let inFlight = false; // <-- forhindrer dobbelt-klik/auto-loop

    function ts() {
      const d = new Date();
      return d.toLocaleTimeString("da-DK", { hour12: false });
    }
    function log(msg, obj) {
      const line = `[${ts()}] ${msg}` + (obj ? `\n${JSON.stringify(obj, null, 2)}` : "");
      logEl.textContent = line + "\n\n" + logEl.textContent;
      console.log(msg, obj || "");
    }

    async function getToken() {
      log("Henter token…");
      const r = await fetch(TOKEN_URL, { method: "POST" });
      const t = await r.text();
      let j = null;
      try { j = JSON.parse(t); } catch {}
      if (!r.ok) throw new Error(`Token HTTP ${r.status}: ${t}`);
      if (!j?.token) throw new Error(`Token mangler: ${t}`);
      log("Token OK.");
      return j.token;
    }

    async function setupDeviceOnce() {
      if (device) return device;

      const token = await getToken();

      log("Initialiserer Twilio Device…");
      device = new Twilio.Device(token, {
        edge: "roaming",
        closeProtection: true,
        debug: true,
      });

      device.on("registered", () => log("Device REGISTERED ✅"));
      device.on("unregistered", () => log("Device UNREGISTERED"));
      device.on("error", (e) => log("Device ERROR", {
        message: e?.message, code: e?.code, name: e?.name, explanation: e?.explanation, causes: e?.causes
      }));

      // VIGTIG: register() kræves ofte før connect
      try {
        await device.register();
        log("device.register() kaldt");
      } catch (e) {
        log("device.register() FEJL", { message: e?.message, code: e?.code });
      }

      return device;
    }

    async function waitRegistered(ms = 9000) {
      const start = Date.now();
      while (Date.now() - start < ms) {
        if (device && device.state === "registered") return true;
        await new Promise(r => setTimeout(r, 150));
      }
      return false;
    }

    async function startCall() {
      // STOP LOOP: kun ét forsøg ad gangen
      if (inFlight) { log("Ignorerer klik: allerede i gang"); return; }
      inFlight = true;

      btnCall.disabled = true;
      btnHangup.disabled = true;

      try {
        log("Klik: Ring til Laura");

        await setupDeviceOnce();

        log("Venter på REGISTERED…");
        const ok = await waitRegistered(9000);
        if (!ok) throw new Error("Device blev ikke registered (ikke WebRTC-test – det er Device state)");

        log("Ringer…");
        call = await device.connect({}); // ingen params
        btnHangup.disabled = false;

        call.on("accept", () => log("Call ACCEPTED ✅"));
        call.on("disconnect", () => {
          log("Call DISCONNECT");
          call = null;
          btnHangup.disabled = true;
          btnCall.disabled = false;
        });
        call.on("error", (e) => log("Call ERROR", { message: e?.message, code: e?.code, name: e?.name }));

      } catch (e) {
        log("KUNNE IKKE STARTE:", { message: e?.message || String(e) });
        btnCall.disabled = false;
        btnHangup.disabled = true;
      } finally {
        // vigtigt: slip låsen når forsøget er færdigt (ellers “hænger” knappen)
        inFlight = false;
      }
    }

    function hangup() {
      log("Lægger på…");
      try {
        if (call) call.disconnect();
        if (device) device.disconnectAll();
      } catch {}
      call = null;
      btnHangup.disabled = true;
      btnCall.disabled = false;
    }

    btnCall.addEventListener("click", startCall);
    btnHangup.addEventListener("click", hangup);

    log("Klar.");
  </script>
</body>
</html>
