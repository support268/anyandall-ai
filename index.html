<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring til Laura</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 18px; }
    button { padding: 10px 14px; margin-right: 10px; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Ring til Laura</h1>
  <p>Tryk ring — giv mikrofonadgang — og sig dit navn.</p>

  <button id="btnCall">Ring til Laura</button>
  <button id="btnHangup" disabled>Læg på</button>
  <button id="btnTest">Kør netværkstest</button>

  <pre id="status">Klar.</pre>

  <!-- Twilio Voice JS SDK (officiel CDN) -->
  <script src="https://sdk.twilio.com/js/voice/releases/2.17.0/twilio.min.js"></script>

  <script>
    const statusEl = document.getElementById("status");
    const btnCall = document.getElementById("btnCall");
    const btnHangup = document.getElementById("btnHangup");
    const btnTest = document.getElementById("btnTest");

    const TOKEN_URL = "https://anyandall-laura-mvp.onrender.com/token";

    let device = null;
    let activeCall = null;

    function ts() {
      const d = new Date();
      return d.toLocaleTimeString("da-DK", { hour12: false });
    }
    function log(line, obj) {
      const s = `[${ts()}] ${line}` + (obj ? `\n${JSON.stringify(obj, null, 2)}` : "");
      statusEl.textContent = s + "\n\n" + statusEl.textContent;
      console.log(line, obj || "");
    }
    function setTop(line) {
      statusEl.textContent = `[${ts()}] ${line}\n\n` + statusEl.textContent;
    }

    async function fetchToken() {
      log("Henter token…");
      const r = await fetch(TOKEN_URL, { method: "POST" });
      const text = await r.text();
      let data = null;
      try { data = JSON.parse(text); } catch (e) {}
      if (!r.ok) {
        throw new Error(`Token HTTP ${r.status}: ${text}`);
      }
      if (!data || !data.token) {
        throw new Error(`Token svar mangler token: ${text}`);
      }
      log("Token OK.");
      return data.token;
    }

    async function ensureDevice() {
      if (device) return device;

      const token = await fetchToken();

      // Preflight først (giver os klar diagnose, men bør ikke blokere)
      try {
        setTop("Preflight starter…");
        const pre = await Twilio.Device.runPreflight(token, { edge: "roaming" });
        log("Preflight COMPLETED:", pre);
      } catch (e) {
        log("Preflight FEJL (fortsætter alligevel): " + (e && e.message ? e.message : String(e)));
      }

      setTop("Initialiserer Twilio Device…");

      device = new Twilio.Device(token, {
        edge: "roaming",
        closeProtection: true,
        debug: true,
        // Allow specifying preferred codecs can help some setups, but keep default for now.
      });

      // VIGTIGT: Voice SDK v2 bruger "registered" som stærk indikator
      device.on("registered", () => log("Device REGISTERED ✅ (ready til opkald)"));
      device.on("unregistered", () => log("Device UNREGISTERED"));
      device.on("error", (e) => log("Device ERROR:", {
        message: e?.message,
        code: e?.code,
        name: e?.name,
        explanation: e?.explanation,
        causes: e?.causes,
      }));

      device.on("incoming", (call) => {
        log("INCOMING call (burde ikke ske i outgoing-only setup)", { from: call?.parameters?.From });
      });

      // Nogle browsere får først registered efter register()
      try {
        await device.register();
        log("device.register() kaldt");
      } catch (e) {
        log("device.register() FEJL:", { message: e?.message, code: e?.code });
      }

      return device;
    }

    async function waitForRegistered(timeoutMs = 8000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        if (device && device.state === "registered") return true;
        await new Promise(r => setTimeout(r, 150));
      }
      return false;
    }

    async function callLaura() {
      btnCall.disabled = true;
      btnHangup.disabled = true;

      try {
        log("Klik: Ring til Laura");

        const d = await ensureDevice();

        setTop("Venter på REGISTERED…");
        const ok = await waitForRegistered(9000);
        if (!ok) {
          throw new Error("Device blev ikke registered (mulig race / token / SDK state)");
        }

        setTop("Ringer… (mikrofon: Allow)");
        // Bemærk: Vi sender ingen params; TwiML App håndterer /twilio/client-voice
        activeCall = await d.connect({});

        btnHangup.disabled = false;

        activeCall.on("accept", () => log("Call ACCEPTED ✅"));
        activeCall.on("disconnect", () => {
          log("Call DISCONNECT");
          activeCall = null;
          btnHangup.disabled = true;
          btnCall.disabled = false;
        });
        activeCall.on("error", (e) => {
          log("Call ERROR:", { message: e?.message, code: e?.code, name: e?.name });
        });

      } catch (e) {
        log("KUNNE IKKE STARTE:", { message: e?.message || String(e) });
        btnCall.disabled = false;
        btnHangup.disabled = true;
      }
    }

    function hangup() {
      try {
        log("Læg på");
        if (activeCall) activeCall.disconnect();
        if (device) device.disconnectAll();
      } catch (e) {
        log("Hangup FEJL:", { message: e?.message || String(e) });
      } finally {
        activeCall = null;
        btnHangup.disabled = true;
        btnCall.disabled = false;
      }
    }

    async function runTest() {
      try {
        const token = await fetchToken();
        setTop("Preflight starter…");
        const pre = await Twilio.Device.runPreflight(token, { edge: "roaming" });
        log("Preflight COMPLETED:", pre);
      } catch (e) {
        log("Preflight TEST FEJL:", { message: e?.message || String(e) });
      }
    }

    btnCall.addEventListener("click", callLaura);
    btnHangup.addEventListener("click", hangup);
    btnTest.addEventListener("click", runTest);

    log("Klar.");
  </script>
</body>
</html>
