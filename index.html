<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring til Laura</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 18px; }
    button { padding: 10px 14px; margin-right: 10px; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Ring til Laura</h1>
  <p><b>Build:</b> v5</p>
  <p>Tryk ring — giv mikrofonadgang — og sig dit navn.</p>

  <button id="btnCall">Ring til Laura</button>
  <button id="btnHangup" disabled>Læg på</button>
  <button id="btnTest">Kør netværkstest</button>

  <pre id="log">Klar.</pre>

  <script>
    const statusEl = document.getElementById("log");
    const btnCall = document.getElementById("btnCall");
    const btnHangup = document.getElementById("btnHangup");
    const btnTest = document.getElementById("btnTest");

    // Token hentes fra din Render-service
    const TOKEN_URL = "https://anyandall-laura-mvp.onrender.com/token";

    // VIGTIGT:
    // Twilio Voice JS SDK 2.x bliver ikke længere hostet på Twilios egen CDN som før,
    // så vi bruger unpkg/jsDelivr i stedet.
    // (Filerne ligger i /dist/twilio(.min).js i @twilio/voice-sdk pakken)
    const TWILIO_SDK_PRIMARY  = "https://unpkg.com/@twilio/voice-sdk@2.18.0/dist/twilio.min.js";
    const TWILIO_SDK_FALLBACK = "https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.0/dist/twilio.min.js";

    let device = null;
    let activeCall = null;

    function ts() {
      const d = new Date();
      return d.toLocaleTimeString("da-DK", { hour12: false });
    }

    function log(msg, obj) {
      const line = "[" + ts() + "] " + msg + (obj ? "\n" + JSON.stringify(obj, null, 2) : "");
      statusEl.textContent = line + "\n\n" + statusEl.textContent;
      console.log(msg, obj || "");
    }

    function errToString(e) {
      if (!e) return "Ukendt fejl";
      if (typeof e === "string") return e;
      if (e instanceof Error) return (e.name || "Error") + ": " + (e.message || "");
      try { return JSON.stringify(e); } catch (_) { return String(e); }
    }

    function hardStop() {
      try {
        if (activeCall) {
          activeCall.disconnect();
          activeCall = null;
        }
      } catch (_) {}
      try {
        if (device) {
          device.destroy();
          device = null;
        }
      } catch (_) {}
      btnHangup.disabled = true;
      log("Hard stop ✅ (alt lyd + Twilio stoppet)");
    }

    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = () => resolve(true);
        s.onerror = () => reject(new Error("Kunne ikke loade: " + src));
        document.head.appendChild(s);
      });
    }

    function getVoiceSdk() {
      // Voice SDK 2.x eksponerer typisk TwilioVoice globalt
      if (window.TwilioVoice && window.TwilioVoice.Device) return window.TwilioVoice;
      // Nogle setups kan have Twilio.Device
      if (window.Twilio && window.Twilio.Device) return window.Twilio;
      return null;
    }

    async function ensureTwilioSdk() {
      const already = getVoiceSdk();
      if (already) {
        log("Twilio SDK allerede loaded ✅");
        return already;
      }

      log("Loader Twilio SDK…", { primary: TWILIO_SDK_PRIMARY });

      try {
        await loadScript(TWILIO_SDK_PRIMARY);
      } catch (e1) {
        log("Primary fejlede, prøver fallback…", { message: errToString(e1), fallback: TWILIO_SDK_FALLBACK });
        await loadScript(TWILIO_SDK_FALLBACK);
      }

      const sdk = getVoiceSdk();
      if (!sdk) throw new Error("Twilio SDK loaded, men global ikke fundet (hverken TwilioVoice eller Twilio).");

      log("Twilio SDK OK ✅");
      return sdk;
    }

    async function getToken() {
      log("Henter token…", { url: TOKEN_URL });
      const r = await fetch(TOKEN_URL, { method: "GET" });
      const text = await r.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) {}
      if (!r.ok) throw new Error("Token HTTP " + r.status + ": " + text);
      if (!data || !data.token) throw new Error("Token svar mangler token: " + text);
      log("Token OK.");
      return data.token;
    }

    async function ensureDevice() {
      const sdk = await ensureTwilioSdk();
      const token = await getToken();

      log("Initialiserer Twilio Device…");

      device = new sdk.Device(token, {
        logLevel: "error",
      });

      device.on("registered", () => log("Device registered ✅"));
      device.on("error", (e) => log("Device error ❌", { message: errToString(e) }));

      device.on("incoming", (c) => {
        log("Incoming call (ikke forventet i denne demo).");
        activeCall = c;
      });

      // I Voice SDK 2.x skal man registrere
      await device.register();
      return device;
    }

    async function callLaura() {
      try {
        hardStop();

        const dev = await ensureDevice();

        btnHangup.disabled = false;

        const params = {};

        log("Ringer op…");
        activeCall = await dev.connect({ params: params });

        activeCall.on("disconnect", () => {
          log("Call disconnected.");
          hardStop();
        });

        activeCall.on("error", (e) => {
          log("Call error ❌", { message: errToString(e) });
          hardStop();
        });

        log("Call connected ✅");
      } catch (e) {
        log("RING FEJL:", { message: errToString(e) });
        hardStop();
      }
    }

    async function runTest() {
      try {
        log("Netværkstest: starter…");
        await ensureTwilioSdk();
        await getToken();
        log("Netværkstest: OK ✅");
      } catch (e) {
        log("Netværkstest FEJL ❌", { message: errToString(e) });
      }
    }

    btnCall.addEventListener("click", () => {
      log("Klik: Ring til Laura");
      callLaura();
    });

    btnHangup.addEventListener("click", () => {
      log("Klik: Læg på");
      hardStop();
    });

    btnTest.addEventListener("click", () => {
      log("Klik: Kør netværkstest");
      runTest();
    });
  </script>
</body>
</html>
