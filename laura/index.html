<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring til Laura</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 24px;">
  <h1>Ring til Laura</h1>
  <p>Tryk ring — giv mikrofonadgang — og sig dit navn.</p>

  <div style="display:flex; gap:12px; align-items:center; margin: 16px 0;">
    <button id="btnCall" style="padding:10px 14px; font-size:16px;">Ring til Laura</button>
    <button id="btnHangup" disabled style="padding:10px 14px; font-size:16px;">Læg på</button>
  </div>

  <pre id="status" style="background:#f6f6f6; padding:12px; border-radius:10px;">Klar.</pre>

  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.17.0/dist/twilio.min.js"></script>
  
  <script>
  const statusEl = document.getElementById("status");
  const btnCall = document.getElementById("btnCall");
  const btnHangup = document.getElementById("btnHangup");

  let device = null;
  let connection = null;

  function log(line) {
    const ts = new Date().toLocaleTimeString("da-DK");
    statusEl.textContent = `[${ts}] ${line}\n` + statusEl.textContent;
  }

  window.addEventListener("error", (e) => log("WINDOW ERROR: " + (e.message || "ukendt")));
  window.addEventListener("unhandledrejection", (e) =>
    log("UNHANDLED REJECTION: " + (e.reason?.message || JSON.stringify(e.reason) || "ukendt"))
  );

  function waitForReady(d, ms = 7000) {
    return new Promise((resolve, reject) => {
      let done = false;

      const t = setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error("Device blev ikke ready (mulig WebRTC/netværk-block)"));
      }, ms);

      d.on("ready", () => {
        if (done) return;
        done = true;
        clearTimeout(t);
        resolve();
      });

      d.on("error", (e) => {
        if (done) return;
        done = true;
        clearTimeout(t);
        reject(new Error(`Device error: ${e.code || ""} ${e.message || JSON.stringify(e)}`));
      });

      // Hvis "offline" rammer, er det næsten altid netværk/firewall
      d.on("offline", () => log("Device offline (netværk/firewall?)"));
    });
  }

  async function getToken() {
    log("Henter token…");
    const r = await fetch("https://anyandall-laura-mvp.onrender.com/token", { method: "POST" });
    const text = await r.text();
    let data = {};
    try { data = JSON.parse(text); } catch {}
    if (!r.ok) throw new Error(`TOKEN HTTP ${r.status}: ${text}`);
    log("Token OK.");
    return data.token;
  }

  async function ensureDevice() {
    if (device) return device;

    if (!window.Twilio || !window.Twilio.Device) {
      throw new Error("SDK: Twilio.Device findes ikke (twilio.min.js blokeret?)");
    }

    const token = await getToken();

    log("Initialiserer Twilio Device…");
    device = new Twilio.Device(token, { debug: true });

    device.on("ready", () => log("Device ready."));
    device.on("error", (e) => log(`Device error: ${e.code || ""} ${e.message || JSON.stringify(e)}`));
    device.on("connect", () => log("Forbundet (connect-event)."));
    device.on("disconnect", () => {
      log("Afsluttet (disconnect-event).");
      connection = null;
      btnHangup.disabled = true;
      btnCall.disabled = false;
    });
    device.on("incoming", () => log("Incoming (burde ikke ske i v1)"));
    device.on("cancel", () => log("Cancel"));
    device.on("reject", () => log("Reject"));

    // Vent på ready før vi går videre
    await waitForReady(device, 7000);
    return device;
  }

  async function callLaura() {
    try {
      btnCall.disabled = true;
      btnHangup.disabled = true;

      log("Klik: Ring til Laura");

      const d = await ensureDevice();

      log("Ringer…");
      connection = await d.connect({});

      // connection events (mere signal)
      if (connection) {
        connection.on("accept", () => log("Call accepted."));
        connection.on("cancel", () => log("Call canceled."));
        connection.on("disconnect", () => log("Call disconnected."));
        connection.on("error", (e) => log("Call error: " + (e?.message || JSON.stringify(e))));
        connection.on("reject", () => log("Call rejected."));
      }

      log("connect() kaldt OK.");
      btnHangup.disabled = false;
    } catch (e) {
      log("KUNNE IKKE STARTE: " + (e?.message || String(e)));
      btnCall.disabled = false;
      btnHangup.disabled = true;
    }
  }

  function hangup() {
    try {
      log("Lægger på…");
      if (connection) connection.disconnect();
      if (device) device.disconnectAll();
    } catch (e) {
      log("HANGUP FEJL: " + (e?.message || String(e)));
    }
  }

  btnCall.addEventListener("click", callLaura);
  btnHangup.addEventListener("click", hangup);

  statusEl.textContent = "";
  log("Klar.");
</script>


</body>
</html>
