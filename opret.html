<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opret Laura – Any & All</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <a href="index.html" class="logo">Any & All</a>
  </header>

  <main>
    <section class="form-section">
      <h1>Vil I have Laura på jeres nummer?</h1>
      <p>Vi sætter hurtigt jeres velkomst og viderestilling op.</p>

      <form action="https://formspree.io/f/xpzvdnve" method="POST" class="setup-form">

        <label for="firmanavn">Firmanavn</label>
        <input type="text" id="firmanavn" name="firmanavn" required />

        <label for="cvr">CVR / Org.nr. (valgfrit)</label>
        <input type="text" id="cvr" name="cvr" />

        <label for="kontaktperson">Kontaktperson</label>
        <input type="text" id="kontaktperson" name="kontaktperson" required />

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required />

        <label for="tlf">Telefonnummer (Laura skal svare på)</label>
        <input type="text" id="tlf" name="tlf" placeholder="+45 xx xx xx xx" required />

        <label for="afdelinger">Afdelinger / rute</label>
        <input type="text" id="afdelinger" name="afdelinger"
               placeholder="Fx: Reception, Salg, Teknik, Økonomi..." />

        <!-- 🚀 NY SEKTOR: Branche-quiz + dynamisk placeholder -->
        <div id="laura-setup">
          <label><strong>Besked / ønsker til velkomst</strong></label>

          <!-- Branchevalg -->
          <div class="branch-picker" style="margin: 10px 0 12px;">
            <p style="margin-bottom: 6px;">Hvilken type virksomhed er I?</p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <button type="button" class="branch-btn" data-branch="maegler">Ejendomsmægler</button>
              <button type="button" class="branch-btn" data-branch="klinik">Klinik / psykolog mv.</button>
              <button type="button" class="branch-btn" data-branch="haandvaerker">Håndværker</button>
              <button type="button" class="branch-btn" data-branch="restaurant">Restaurant</button>
              <button type="button" class="branch-btn" data-branch="andet">Andet</button>
            </div>
          </div>

          <!-- Selve tekstfeltet -->
          <textarea
            id="beskedfelt"
            name="besked"
            placeholder="Fx: velkomst/tone, interne ruter/numre, særlige svar Laura må give, ekstra info der ikke står på jeres hjemmeside (fx svartider, liggetider, m²-priser, samarbejdspartnere), og hvor beskeder skal sendes."
            style="width: 100%; min-height: 160px; padding: 12px; resize: vertical;"
          ></textarea>

          <!-- Skjult felt til branche -->
          <input type="hidden" id="branche-hidden" name="branche" value="">
        </div>

        <button type="submit" class="submit-btn">Send til os</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Any & All. Alle rettigheder forbeholdes.</p>
  </footer>

  <!-- 🚀 JavaScript til branchevalg + placeholder -->
  <script>
    function updatePlaceholder(branche) {
      const field = document.querySelector("#beskedfelt");
      if (!field) return;

      const placeholders = {
        maegler: `Fx:
- Velkomst / tone
- Viderestilling: vurdering, køberrådgivning, udlejning
- Info Laura må bruge, som ikke står på hjemmesiden
  (svartider, gennemsnitlig liggetid, m²-priser, samarbejdspartnere, Trustpilot/Boligsiden)
- Hvor beskeder skal sendes (mail/SMS)`,

        klinik: `Fx:
- Velkomst (rolig og tryg)
- Ruter: sekretariat, booking, aflysninger
- Info Laura må bruge, som ikke står på hjemmesiden
  (ventetider, svartider, særlige forløb)
- Hvor beskeder skal sendes (mail/SMS)`,

        haandvaerker: `Fx:
- Velkomst
- Ruter: akutservice, tilbud, drift/kontor
- Info Laura må bruge, som ikke står på hjemmesiden
  (responstid, dækningsområde, typen af opgaver)
- Hvor beskeder skal sendes (mail/SMS)`,

        restaurant: `Fx:
- Velkomst
- Ruter: bordreservation, selskaber, takeaway
- Info Laura må bruge, som ikke står på hjemmesiden
  (typisk svartid, max antal gæster pr. selskab)
- Hvor beskeder skal sendes (mail/SMS)`
      };

      field.placeholder =
        placeholders[branche] ||
        "Fx: velkomst/tone, interne ruter/numre, særlige svar Laura må give, ekstra info der ikke står på jeres hjemmeside, og hvor beskeder skal sendes.";
    }

    document.addEventListener("DOMContentLoaded", function () {
      const buttons = document.querySelectorAll(".branch-btn");
      const hidden = document.querySelector("#branche-hidden");

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          // Aktiv styling
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const branche = btn.getAttribute("data-branch");
          updatePlaceholder(branche);

          if (hidden) {
            hidden.value = branche;
          }
        });
      });
    });
  </script>
</body>
</html>
